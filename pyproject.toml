[project]
name = "local-assistant"
version = "0.1.0"
description = "Lokales persönliches Assistenzsystem mit Daemon, Vault und HUD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "watchdog>=6.0.0",
    "sqlite-vec>=0.1.6",
    "apscheduler>=3.10.4",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.9.0",
]

[project.scripts]
assistant-daemon = "daemon.main:main"
assistant-cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
